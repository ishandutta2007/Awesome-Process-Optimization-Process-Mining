<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 420"><defs><linearGradient id="bgGradient" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0f1d"/><stop offset="50%" stop-color="#0f172a"/><stop offset="100%" stop-color="#1e1b4b"/></linearGradient><linearGradient id="accentGradient" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="cardBg" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="rgba(30, 41, 59, 0.75)"/><stop offset="100%" stop-color="rgba(15, 23, 42, 0.85)"/></linearGradient><linearGradient id="glowLine" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#06b6d4" stop-opacity=".8"/><stop offset="100%" stop-color="#a855f7" stop-opacity=".8"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="6"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="softShadow" width="120%" height="120%" x="-10%" y="-10%"><feDropShadow dx="0" dy="8" flood-color="#000" flood-opacity=".6" stdDeviation="12"/></filter></defs><style>@keyframes pulseGlow{0%{opacity:.35;transform:scale(1)}50%{opacity:.75;transform:scale(1.08)}}@keyframes floatParticle{0%{transform:translateY(0) translateX(0);opacity:.3}50%{transform:translateY(-12px) translateX(8px);opacity:.85}}@keyframes flowTrace{0%{stroke-dashoffset:400}}@keyframes nodePulse{0%{r:6;fill-opacity:.8}50%{r:9;fill-opacity:1}}.bg-grid{stroke:rgba(255,255,255,.04);stroke-width:1}.flow-path{stroke:url(#glowLine);stroke-width:2.5;fill:none;stroke-dasharray:8 6;animation:flowTrace 14s linear infinite}.flow-path-fast{stroke:#38bdf8;stroke-width:1.5;fill:none;stroke-dasharray:4 4;animation:flowTrace 7s linear infinite}.glow-circle{animation:pulseGlow 8s ease-in-out infinite;transform-origin:center}.badge-text,.brand-subtitle,.brand-title{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.brand-title{font-weight:800;fill:#fff;letter-spacing:-.5px}.brand-subtitle{font-weight:400;fill:#94a3b8}.badge-text{font-size:13px;font-weight:600;fill:#e2e8f0}</style><rect width="1200" height="420" fill="url(#bgGradient)" rx="16"/><circle cx="180" cy="100" r="140" fill="#0284c7" class="glow-circle" filter="url(#glow)" opacity=".15"/><circle cx="1020" cy="300" r="160" fill="#7c3aed" class="glow-circle" filter="url(#glow)" opacity=".18" style="animation-delay:-3s"/><circle cx="600" cy="210" r="180" fill="#0d9488" class="glow-circle" filter="url(#glow)" opacity=".1" style="animation-delay:-5s"/><g class="bg-grid"><line x1="100" x2="100" y1="0" y2="420"/><line x1="250" x2="250" y1="0" y2="420"/><line x1="400" x2="400" y1="0" y2="420"/><line x1="550" x2="550" y1="0" y2="420"/><line x1="700" x2="700" y1="0" y2="420"/><line x1="850" x2="850" y1="0" y2="420"/><line x1="1000" x2="1000" y1="0" y2="420"/><line x1="1150" x2="1150" y1="0" y2="420"/><line x1="0" x2="1200" y1="80" y2="80"/><line x1="0" x2="1200" y1="160" y2="160"/><line x1="0" x2="1200" y1="240" y2="240"/><line x1="0" x2="1200" y1="320" y2="320"/><line x1="0" x2="1200" y1="400" y2="400"/></g><g opacity=".75"><path d="M 80,340 C 200,340 180,90 320,90" class="flow-path"/><path d="M 320,90 C 480,90 420,330 580,330" class="flow-path-fast"/><path d="M 580,330 C 720,330 700,100 860,100" class="flow-path"/><path d="M 860,100 C 980,100 1020,320 1120,320" class="flow-path-fast"/><g transform="translate(80, 340)"><circle r="14" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/><circle r="5" fill="#38bdf8"/></g><g transform="translate(320, 90)"><circle r="16" fill="#0f172a" stroke="#818cf8" stroke-width="2"/><circle r="6" fill="#818cf8"/></g><g transform="translate(580, 330)"><circle r="16" fill="#0f172a" stroke="#34d399" stroke-width="2"/><circle r="6" fill="#34d399"/></g><g transform="translate(860