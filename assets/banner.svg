<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.75)" />
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.85)" />
    </linearGradient>

    <linearGradient id="glowLine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.8" />
    </linearGradient>

    <!-- Filters for Glow Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.75; transform: scale(1.08); }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
      50% { transform: translateY(-12px) translateX(8px); opacity: 0.85; }
      100% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
    }
    @keyframes flowTrace {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes nodePulse {
      0%, 100% { r: 6; fill-opacity: 0.8; }
      50% { r: 9; fill-opacity: 1; }
    }

    .bg-grid {
      stroke: rgba(255, 255, 255, 0.04);
      stroke-width: 1;
    }
    .flow-path {
      stroke: url(#glowLine);
      stroke-width: 2.5;
      fill: none;
      stroke-dasharray: 8 6;
      animation: flowTrace 14s linear infinite;
    }
    .flow-path-fast {
      stroke: #38bdf8;
      stroke-width: 1.5;
      fill: none;
      stroke-dasharray: 4 4;
      animation: flowTrace 7s linear infinite;
    }
    .particle {
      animation: floatParticle 6s ease-in-out infinite;
    }
    .glow-circle {
      animation: pulseGlow 8s ease-in-out infinite;
      transform-origin: center;
    }
    .brand-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .brand-subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      font-weight: 600;
      fill: #e2e8f0;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bgGradient)" rx="16" />

  <!-- Animated Glowing Ambience Orbs in Background -->
  <circle cx="180" cy="100" r="140" fill="#0284c7" opacity="0.15" filter="url(#glow)" class="glow-circle" />
  <circle cx="1020" cy="300" r="160" fill="#7c3aed" opacity="0.18" filter="url(#glow)" class="glow-circle" style="animation-delay: -3s;" />
  <circle cx="600" cy="210" r="180" fill="#0d9488" opacity="0.1" filter="url(#glow)" class="glow-circle" style="animation-delay: -5s;" />

  <!-- Grid Pattern Overlay -->
  <g class="bg-grid">
    <line x1="100" y1="0" x2="100" y2="420" />
    <line x1="250" y1="0" x2="250" y2="420" />
    <line x1="400" y1="0" x2="400" y2="420" />
    <line x1="550" y1="0" x2="550" y2="420" />
    <line x1="700" y1="0" x2="700" y2="420" />
    <line x1="850" y1="0" x2="850" y2="420" />
    <line x1="1000" y1="0" x2="1000" y2="420" />
    <line x1="1150" y1="0" x2="1150" y2="420" />
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="320" x2="1200" y2="320" />
    <line x1="0" y1="400" x2="1200" y2="400" />
  </g>

  <!-- Process Mining Flowchart Connections in Background -->
  <g opacity="0.75">
    <!-- Curve 1: Event Ingestion to Discovery -->
    <path d="M 80,340 C 200,340 180,90 320,90" class="flow-path" />
    <!-- Curve 2: Discovery to Conformance Checking -->
    <path d="M 320,90 C 480,90 420,330 580,330" class="flow-path-fast" />
    <!-- Curve 3: Conformance to Root Cause Analysis -->
    <path d="M 580,330 C 720,330 700,100 860,100" class="flow-path" />
    <!-- Curve 4: Root Cause to Action Orchestration -->
    <path d="M 860,100 C 980,100 1020,320 1120,320" class="flow-path-fast" />

    <!-- Process Mining Graph Nodes -->
    <g transform="translate(80, 340)">
      <circle r="14" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
      <circle r="5" fill="#38bdf8" />
    </g>
    <g transform="translate(320, 90)">
      <circle r="16" fill="#0f172a" stroke="#818cf8" stroke-width="2" />
      <circle r="6" fill="#818cf8" />
    </g>
    <g transform="translate(580, 330)">
      <circle r="16" fill="#0f172a" stroke="#34d399" stroke-width="2" />
      <circle r="6" fill="#34d399" />
    </g>
    <g transform="translate(860, 100)">
      <circle r="16" fill="#0f172a" stroke="#c084fc" stroke-width="2" />
      <circle r="6" fill="#c084fc" />
    </g>
    <g transform="translate(1120, 320)">
      <circle r="14" fill="#0f172a" stroke="#fb7185" stroke-width="2" />
      <circle r="5" fill="#fb7185" />
    </g>

    <!-- Animated Data Flow Packets / Particles traveling along lines -->
    <circle r="4" fill="#67e8f9" filter="url(#glow)">
      <animateMotion path="M 80,340 C 200,340 180,90 320,90" dur="4s" repeatCount="indefinite" />
    </circle>
    <circle r="4" fill="#a78bfa" filter="url(#glow)">
      <animateMotion path="M 320,90 C 480,90 420,330 580,330" dur="4.5s" repeatCount="indefinite" />
    </circle>
    <circle r="4" fill="#6ee7b7" filter="url(#glow)">
      <animateMotion path="M 580,330 C 720,330 700,100 860,100" dur="4s" repeatCount="indefinite" />
    </circle>
    <circle r="4" fill="#f472b6" filter="url(#glow)">
      <animateMotion path="M 860,100 C 980,100 1020,320 1120,320" dur="3.8s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Foreground Protective Glass Card to Keep Titles Always Legible -->
  <rect x="120" y="70" width="960" height="280" rx="20" fill="url(#cardBg)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" filter="url(#softShadow)" />

  <!-- Top Pill / Badge inside Card -->
  <g transform="translate(440, 105)">
    <rect width="320" height="32" rx="16" fill="rgba(56, 189, 248, 0.1)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1" />
    <circle cx="18" cy="16" r="5" fill="#38bdf8">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="32" y="21" class="badge-text" fill="#38bdf8">⚡ CURATED ENTERPRISE &amp; OSS DIRECTORY</text>
  </g>

  <!-- Main Title -->
  <text x="600" y="185" text-anchor="middle" class="brand-title" font-size="40">
    Process Optimization &amp; Process Mining
  </text>

  <!-- Subtitle -->
  <text x="600" y="225" text-anchor="middle" class="brand-subtitle" font-size="18">
    Process Discovery • Conformance Checking • Task Mining • Object-Centric Intelligence
  </text>

  <!-- Capability Badges Bar -->
  <g transform="translate(195, 260)">
    <!-- Badge 1: Discovery -->
    <g transform="translate(0, 0)">
      <rect width="145" height="36" rx="10" fill="rgba(15, 23, 42, 0.75)" stroke="#38bdf8" stroke-width="1.2" />
      <text x="72" y="23" text-anchor="middle" class="badge-text">🔍 Discovery</text>
    </g>
    <!-- Badge 2: Conformance -->
    <g transform="translate(165, 0)">
      <rect width="165" height="36" rx="10" fill="rgba(15, 23, 42, 0.75)" stroke="#818cf8" stroke-width="1.2" />
      <text x="82" y="23" text-anchor="middle" class="badge-text">⚖️ Conformance</text>
    </g>
    <!-- Badge 3: Intelligence -->
    <g transform="translate(350, 0)">
      <rect width="155" height="36" rx="10" fill="rgba(15, 23, 42, 0.75)" stroke="#34d399" stroke-width="1.2" />
      <text x="77" y="23" text-anchor="middle" class="badge-text">🧠 Intelligence</text>
    </g>
    <!-- Badge 4: Task Mining -->
    <g transform="translate(525, 0)">
      <rect width="145" height="36" rx="10" fill="rgba(15, 23, 42, 0.75)" stroke="#c084fc" stroke-width="1.2" />
      <text x="72" y="23" text-anchor="middle" class="badge-text">🖥️ Task Mining</text>
    </g>
    <!-- Badge 5: OCPM -->
    <g transform="translate(690, 0)">
      <rect width="120" height="36" rx="10" fill="rgba(15, 23, 42, 0.75)" stroke="#f472b6" stroke-width="1.2" />
      <text x="60" y="23" text-anchor="middle" class="badge-text">🌐 OCPM</text>
    </g>
  </g>
</svg>
